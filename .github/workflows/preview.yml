name: Vorschau für Pull Requests

# Baut die Website für jeden PR und legt sie unter
# https://reaktor23.org/pr-preview/pr-<nummer>/ ab. Die eigentliche Website
# bleibt unverändert. Beim Schließen des PRs wird die Vorschau wieder entfernt.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency: preview-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source 🛎️
        uses: actions/checkout@v7

      - name: Build website 🔧
        if: github.event.action != 'closed'
        run: |
          docker build \
            --build-arg BASE_URL="https://reaktor23.org/pr-preview/pr-${{ github.event.number }}/" \
            --target output --output type=local,dest=public .

      - name: Deploy preview 👀
        uses: rossjrw/pr-preview-action@v1.8.1
        with:
          source-dir: public
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          pages-base-url: reaktor23.org
          deploy-commit-message: "Vorschau für PR ${{ github.event.number }} aktualisiert"
          remove-commit-message: "Vorschau für PR ${{ github.event.number }} entfernt"
