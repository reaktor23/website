name: Website veröffentlichen

on:
  push:
    branches:
      - master
    paths-ignore:
      - README.md
      - .gitignore

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source 🛎️
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Die Hugo-Version steht im Dockerfile und wird von Dependabot aktualisiert.
      - name: Build website 🔧
        run: |
          docker build --target output --output type=local,dest=public .

      - name: Deploy to gh-pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          branch: gh-pages
          folder: public
          # Vorschauen der offenen PRs und die Domain-Konfiguration nicht löschen
          clean-exclude: |
            pr-preview
            CNAME
          force: false
